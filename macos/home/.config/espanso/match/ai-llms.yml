- trigger: ";sum"
  replace: "{{out}}"
  force_clipboard: true
  vars:
  - name: out
    type: shell
    params:
      cmd: "pbpaste | ~/.local/bin/espanso_pi.sh sum"
- trigger: ";chat"
  replace: "{{out}}"
  force_clipboard: true
  vars:
  - name: out
    type: shell
    params:
      cmd: "pbpaste | ~/.local/bin/espanso_pi.sh chat"
- trigger: ";trad"
  replace: "{{out}}"
  force_clipboard: true
  vars:
  - name: out
    type: shell
    params:
      cmd: "pbpaste | ~/.local/bin/espanso_pi.sh trad"
- trigger: ";fix"
  replace: "{{out}}"
  force_clipboard: true
  vars:
  - name: out
    type: shell
    params:
      cmd: "pbpaste | ~/.local/bin/espanso_pi.sh fix"
