# ============================================================================
# aspect
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{b:pane_current_path}'

setw -g window-status-separator " "

set -g status "on"
# set -g status "off"
setw -g window-status-activity-style "none"

set -g status-justify "left"

# set -g status-left "#[fg=colour16,bg=colour254,bold] #S #[fg=colour254,bg=colour234,nobold,nounderscore,noitalics]"
set -g status-left " #S "
set -g status-left-length "100"

## include the hostname on the right
# set -g status-right "#[fg=colour247,bg=colour236] %Y-%m-%d #[fg=colour231,bg=colour31] %H:%M #[fg=colour16,bg=colour254,bold,nounderscore,noitalics] #h "
# The continuum_save.sh hook is spelled out here because re-sourcing this file
# resets status-right and tmux-continuum does not always re-add it, which
# silently stops the autosave until the next server restart.
# #{@cc_count} is the red/green waiting count, kept by cc-tmux-state on every state change.
set -g status-right "#{@cc_count}#[default]#($HOME/.tmux/plugins/tmux-continuum/scripts/continuum_save.sh) %Y-%m-%d  %H:%M "
# set -g status-right "#[fg=colour236,bg=colour234,nobold,nounderscore,noitalics]#[fg=colour247,bg=colour236]%Y-%m-%d #[fg=colour238]#[fg=colour247,bg=colour238]%H:%M #[fg=colour252,bg=colour236,nobold,nounderscore,noitalics]#[fg=colour235,bg=colour252]#h  "
# set -g status-right "#[fg=colour247,bg=colour236] %Y-%m-%d #[fg=colour231,bg=colour31] %H:%M "
# set -g status-right-length "100"

# setw -g window-status-current-format "#[fg=colour234,bg=colour31]#[fg=colour117,bg=colour31,nobold,nounderscore,noitalics] #I #[fg=colour231,bg=colour31,bold]#W#[fg=colour31,bg=colour234,nobold,nounderscore,noitalics]"
# #{@cc} is the Claude Code state icon set by cc-tmux-state (empty for other windows).
# Red: a pane wants permission. Green: a turn finished that you have not looked at.
# Looking at the pane clears the green. Prefix A lists the waiting panes.
set-hook -g pane-focus-in 'run-shell -b "$HOME/.local/bin/cc-tmux-state seen #{pane_id}"'
# A closed pane drops out of #{@cc_count}. pane-exited covers a command that exits,
# after-kill-pane, window-closed and session-closed cover the kill commands.
set-hook -g pane-exited 'run-shell -b "$HOME/.local/bin/cc-tmux-state recount"'
set-hook -g after-kill-pane 'run-shell -b "$HOME/.local/bin/cc-tmux-state recount"'
set-hook -g window-closed 'run-shell -b "$HOME/.local/bin/cc-tmux-state recount"'
set-hook -g session-closed 'run-shell -b "$HOME/.local/bin/cc-tmux-state recount"'
# On attach (and after a resurrect restore) refresh the tmux-board ledger.
set-hook -g client-attached 'run-shell -b "$HOME/.local/bin/cc-board-refresh"'
bind A display-popup -E -w 80% -h 60% "$HOME/.local/bin/cc-attention"
# Prefix g: fzf over Claude sessions, enter goes to its pane or resumes it in a new window.
# A modal pane (tmux 3.8) that survives a resize. A target in the same window as
# the modal gets no focus, because tmux refocuses the opener pane on close.
bind g new-pane -O -x 60% -y 30% -X 20% -Y 35% "python3 $HOME/.claude/skills/sessions/sessions.py ask"
# bind g display-popup -E -w 60% -h 30% "python3 $HOME/.claude/skills/sessions/sessions.py ask"
# Prefix G: fzf over every tmux pane by window name, claude session name and title; enter focuses it.
bind G display-popup -E -w 80% -h 70% "python3 $HOME/.claude/skills/sessions/sessions.py panes"
setw -g window-status-current-format " #I #{@cc}#[default]#W "
setw -g window-status-format " #I #{@cc}#[default]#W "

# Colours: a near-black band below the terminal background, the current
# window as a lighter pill, popups and menus on the terminal background.
set -g status-style 'bg=colour235,fg=colour252'
set -g status-left-style 'fg=themewhite,bold'
set -g status-right-style 'fg=themewhite'
setw -g window-status-style 'fg=colour252,nobold'
setw -g window-status-current-style 'bg=colour240,fg=themewhite,bold'
setw -g window-status-activity-style 'fg=themeyellow,noreverse'
set -g message-style "bg=themedarkgrey,fg=themeyellow,#{?#{m/r:(^|#,)IS(PANE|MODE)($|#,),#{prompt_flags}},,fill=themedarkgrey}"
set -g message-command-style "bg=themedarkgrey,fg=themeblue,#{?#{m/r:(^|#,)IS(PANE|MODE)($|#,),#{prompt_flags}},,fill=themedarkgrey}"
setw -g pane-border-style 'fg=colour238'
setw -g pane-active-border-style "fg=#{?pane_modal_flag,themeblue,#{?pane_marked,thememagenta,#{?synchronize-panes,themered,#{?pane_in_mode,themeyellow,themelightgrey}}}}"
set -g popup-style 'bg=default,fg=default'
set -g popup-border-style 'bg=default,fg=colour238'
set -g popup-border-lines rounded
set -g menu-style 'bg=default,fg=default'
set -g menu-border-style 'bg=default,fg=colour238'
set -g menu-border-lines rounded
set -g menu-selected-style 'bg=colour238,fg=themewhite,bold'
setw -g mode-style 'noattr,bg=colour238,fg=themewhite'

