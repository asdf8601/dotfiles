# -----------------------------------------------------------------------------
# Plugin Manager - https://github.com/tmux-plugins/tpm
# If you didn't use my dotfiles install script you'll need to:
#   Step 1) git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
#   Step 2) Reload tmux if it's already started with `r
#   Step 3) Launch tmux and hit `I (capital i) to fetch any plugins
# -----------------------------------------------------------------------------
# List of plugins

# Active plugins
set -g @plugin 'tmux-plugins/tpm'  # Plugin Manager
set -g @plugin 'tmux-plugins/tmux-sensible'  # A set of tmux options that should be acceptable to everyone.
set -g @plugin 'tmux-plugins/tmux-resurrect' # Restore tmux environment
set -g @plugin 'tmux-plugins/tmux-continuum' # automatic restore and continuous saving of tmux env
set -g @plugin 'tmux-plugins/tmux-open' # open on selection: o, c-o, s-s
set -g @plugin 'wfxr/tmux-fzf-url' # fzf for urls in tmux: c-u

# Disabled plugins
# set -g @plugin 'jaclu/tmux-menus'  # A set of useful menus for tmux <prefix> + \
# set -g @plugin 'fcsonline/tmux-thumbs'
# set -g @plugin 'catppuccin/tmux'
# set -g @plugin 'xamut/tmux-spotify'
# set -g @plugin 'christoomey/vim-tmux-navigator'
# set -g @plugin 'tmux-plugins/tmux-yank'

# set -g @resurrect-processes '~ssh'
set -g @resurrect-processes '~ipython ~ccr "~claude->claude --continue"'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
