# Remap C-b by C-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix
set -g history-limit 50000

# terminal
# https://pi.dev/docs/latest/tmux
# Pi requests extended-key reporting when the terminal does not provide the
# Kitty keyboard protocol directly. CSI-u is the most reliable format for
# forwarding modified keys through tmux.
set -g extended-keys on
# set -g extended-keys-format csi-u

# set -wg xterm-keys on
# set -g default-terminal 'screen-256color'
# set -g default-terminal 'tmux-256color'
# set-option -sa terminal-overrides ",$TERM:RGB"

set -g base-index 1
setw -g pane-base-index 1

# Reload a file when it changes.
# https://unix.stackexchange.com/a/383044
# set -g focus-events oN

set-option -sg escape-time 10
set-option -g status-position top
set-option -g detach-on-destroy off
# Let OSC notifications from programs (Claude Code) reach the terminal.
set -g allow-passthrough on

set -g mouse off
# set -g mouse on
# Toggle mouse on/off
bind-key m set-option -gF mouse "#{?mouse,off,on}"\; display-message "#{?mouse,Mouse: ON,Mouse: OFF}"
bind-key -n C-Enter send-keys C-m


# share session throught browser
